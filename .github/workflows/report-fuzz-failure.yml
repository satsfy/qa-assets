# Open an issue in the rust-bitcoin repo when the corpora update run fails
# and close it when the run is green again. Mirrors rust-bitcoin's
# ci-failure-issues.yml, which used to watch the in-repo Fuzz cron.
#
# Cross-repo issue writes need a token, the default GITHUB_TOKEN is scoped
# to this repo. Add a fine-grained PAT with issues read and write on the
# rust-bitcoin repo as the RUST_BITCOIN_ISSUES_TOKEN actions secret. Without
# the secret the job logs a notice and does nothing.
name: Report fuzz failures

on:
  workflow_run:  # zizmor: ignore[dangerous-triggers]
    workflows:
      - Update fuzz corpora
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: report-fuzz-failures
  cancel-in-progress: false

jobs:
  sync-issue:
    if: ${{ contains(fromJson('["failure","success"]'), github.event.workflow_run.conclusion) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check token
        id: token
        env:
          TOKEN: ${{ secrets.RUST_BITCOIN_ISSUES_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "RUST_BITCOIN_ISSUES_TOKEN is not set, skipping issue sync"
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        if: ${{ steps.token.outputs.have_token == 'true' }}
        with:
          github-token: ${{ secrets.RUST_BITCOIN_ISSUES_TOKEN }}
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = "rust-bitcoin";
            const marker = "<!-- ci-failure-key:qa-assets-fuzz -->";
            const workflowUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/workflows/update-corpora.yml`;

            const formatTs = iso => {
              const d = new Date(iso);
              const pad = n => String(n).padStart(2, "0");
              return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())} at ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())} UTC`;
            };

            function titleFor() {
              return "The qa-assets fuzz workflow is failing";
            }

            function bodyForFailure() {
              return [
                marker,
                "",
                `The [qa-assets fuzz workflow](${workflowUrl}) started failing on ${formatTs(run.created_at)}: [run #${run.run_number}](${run.html_url})`,
                "",
                "A failing fuzz job usually means fuzzing found a crash. The crashing input is attached to the run as a `crash-<target>` artifact.",
              ].join("\n");
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find(issue =>
              !issue.pull_request && issue.body && issue.body.includes(marker)
            );

            if (run.conclusion === "failure" && !existing) {
              await github.rest.issues.create({
                owner,
                repo,
                title: titleFor(),
                body: bodyForFailure(),
              });
            }

            if (run.conclusion === "success" && existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body: `The [qa-assets fuzz workflow](${workflowUrl}) successfully ran again on ${formatTs(run.created_at)}: [run #${run.run_number}](${run.html_url}).`,
              });

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                state: "closed",
              });
            }
